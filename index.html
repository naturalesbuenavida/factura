<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro Financiero</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #eef7f1;
      padding: 30px;
    }
    .form-container {
      max-width: 520px;
      margin: auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }
    h1 {
      text-align: center;
      color: #2f6e43;
    }
    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    input[readonly] {
      background: #f1f5f3;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #2f6e43;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="form-container">
    <h1>Registro Financiero</h1>

    <form id="registroForm" novalidate>

      <label>ID</label>
      <input type="text" id="id" readonly>

      <label>Concepto</label>
      <input type="text" id="concepto" required>

      <label>Fecha</label>
      <input type="date" id="fecha" required>

      <label>Observaciones</label>
      <textarea id="observaciones"></textarea>

      <label>Pago</label>
      <select id="pago" required>
        <option value="">Seleccione</option>
        <option>Efectivo</option>
        <option>Nequi</option>
        <option>Cta Ahorros</option>
        <option>Otro</option>
      </select>

      <label>Valor (COP)</label>
      <input type="number" id="valor" required>

      <button type="submit">Guardar</button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const form = document.getElementById("registroForm");
      const idInput = document.getElementById("id");

      function generarID() {
        const now = new Date();
        const rand = Math.floor(Math.random() * 1000);
        return `ID-${now.getFullYear()}${now.getMonth()+1}${now.getDate()}-${rand}`;
      }

      idInput.value = generarID();

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const data = {
          id: idInput.value,
          concepto: document.getElementById("concepto").value,
          fecha: document.getElementById("fecha").value,
          observaciones: document.getElementById("observaciones").value,
          pago: document.getElementById("pago").value,
          valor: document.getElementById("valor").value
        };

        fetch("https://script.google.com/macros/s/AKfycbybs-Dxxuso6B4ohH1p_TUXx9PWF1QYIWJRj03YT31HNug7bf5L5IwcypXST9peYpLjfQ/exec", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        })
        .then(r => r.json())
        .then(() => {
          alert("Registro guardado correctamente ✅");
          form.reset();
          idInput.value = generarID();
        })
        .catch(err => {
          alert("Error al guardar ❌");
          console.error(err);
        });
      });

    });
  </script>

</body>
</html>
